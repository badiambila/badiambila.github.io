<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="fav" rel="icon" type="image/png" href="img/mascot_icon.png">
<script>
  try { if (localStorage.getItem("newtab-theme") === "blue") document.documentElement.setAttribute("data-theme", "blue"); } catch (e) {}
</script>
<style>
  /* ---- palette (edit these to retune the gradients) ---- */
  :root {
    --sky-top:   #f59cc0;
    --sky-mid:   #fbc9dd;
    --glow-1:    #f9c3da;
    --glow-2:    #dcaaf0;   /* lilac core of the bottom glow, like Camino's purple */
    --glow-3:    #fde3ee;
    --text:      #4a3f46;
    --muted:     #9a7f8d;
    --link:      #b0306f;
    --glow-end:  #fff7fb;
    --heading:   #4d4249;
    --in-dark:   #6b5c64;
    --in-light:  #d9ccd2;
    --btn-top:   #fbf3f7;
    --btn-bot:   #e9d9e0;
    --btn-edge:  #8b7a83;
    --btn-lo:    #bfa9b4;
    --focus:     #f5a6c9;
    --sel:       #b0306f;
  }

  /* "presentation" theme: blue sky, neutral grays, no mascot */
  html[data-theme="blue"] {
    --sky-top:   #5b9be6;
    --sky-mid:   #a8cbf4;
    --glow-1:    #b9c9f1;
    --glow-2:    #8f90e0;
    --glow-3:    #dde6fa;
    --text:      #3f4650;
    --muted:     #7b8794;
    --link:      #2a55b8;
    --glow-end:  #f6f9ff;
    --heading:   #3f4650;
    --in-dark:   #5f6670;
    --in-light:  #d3d8de;
    --btn-top:   #f3f2ec;
    --btn-bot:   #dedbd0;
    --btn-edge:  #7d7f80;
    --btn-lo:    #b3b0a4;
    --focus:     #8fb4ee;
    --sel:       #2a55b8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font: 13px/1.5 "Lucida Grande", "Lucida Sans Unicode", Tahoma, Verdana, sans-serif;
    color: var(--text);
    background-color: #fff;
    background-image:
      /* soft "cloud" highlights near the top */
      radial-gradient(ellipse 380px 90px at 12% 150px, rgba(255,255,255,.75), transparent 70%),
      radial-gradient(ellipse 460px 110px at 82% 90px,  rgba(255,255,255,.65), transparent 70%),
      radial-gradient(ellipse 300px 70px  at 55% 210px, rgba(255,255,255,.7),  transparent 70%),
      radial-gradient(ellipse 520px 60px  at 30% 40px,  rgba(255,255,255,.35), transparent 70%),
      /* main vertical gradient: sky -> white -> glow */
      linear-gradient(to bottom,
        var(--sky-top) 0,
        var(--sky-mid) 130px,
        #fff 330px,
        #fff calc(100% - 340px),
        var(--glow-1) calc(100% - 170px),
        var(--glow-2) calc(100% - 100px),
        var(--glow-3) calc(100% - 52px),
        var(--glow-end) 100%);
    background-repeat: no-repeat;
  }

  ::selection { background: var(--sel); color: #fff; }

  main {
    flex: 1;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---- header ---- */
  header { padding-top: 22px; height: 70px; position: relative; }

  /* ---- body copy ---- */
  h1 {
    margin: 36px 0 8px;
    font: 400 30px/1.2 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    color: var(--heading);
  }
  #when { margin: 0 0 54px; max-width: 460px; }

  /* ---- search ---- */
  form { margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .logo-box {
    flex: 0 0 210px; height: 46px;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .logo-box img { max-width: 100%; max-height: 40px; object-fit: contain; }

  input[type=text] {
    flex: 1; min-width: 0;
    height: 24px; padding: 2px 4px;
    font: 14px "Lucida Grande", Tahoma, Verdana, sans-serif;
    background: #fff;
    border: 1px solid;
    border-color: var(--in-dark) var(--in-light) var(--in-light) var(--in-dark);
    outline: none;
  }
  input[type=text]:focus { box-shadow: 0 0 0 2px var(--focus); }

  button, select {
    font: 13px "Lucida Grande", Tahoma, Verdana, sans-serif;
    color: #222;
    background: linear-gradient(var(--btn-top), var(--btn-bot));
    border: 1px solid var(--btn-edge);
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 var(--btn-lo);
    height: 24px; padding: 0 12px;
    cursor: pointer;
  }
  button:active { box-shadow: inset 1px 1px 0 var(--btn-lo), inset -1px -1px 0 #fff; background: var(--btn-bot); }
  select { padding: 0 4px; }

  .pick { margin: 12px 0 0 218px; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .pick label { font-size: 12px; }

  /* ---- footer ---- */
  footer { width: 100%; max-width: 880px; margin: 0 auto; padding: 0 24px 22px; font-size: 12px; color: var(--muted); }

  html[data-theme="blue"] .heart { display: none; }


  /* ---- settings gear + panel ---- */
  #gear {
    position: fixed; top: 10px; right: 14px; z-index: 10;
    width: 30px; height: 27px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; box-shadow: none;
    opacity: .85;
  }
  #gear:hover { opacity: 1; }
  #gear:active { background: none; box-shadow: none; }
  #gear svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  #gear rect { fill: #fff; }

  /* ---- service status lights ---- */
  .unk  .dot { --c1: #e4e4e4; --c2: #9a9a9a; }
  .up   .dot { --c1: #6fe07c; --c2: #2a9a3b; --glow: rgba(60,200,80,.6); }

  @media (max-width: 700px) {
  }

  @media (max-width: 640px) {
    .logo-box { flex-basis: 110px; }
    .pick { margin-left: 0; }
  }
</style>
<link rel="stylesheet" href="aqua.css">
<link rel="stylesheet" href="peek.css">
</head>
<body>
<button id="gear" type="button" title="Settings" aria-label="Settings"><svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect y="0" width="14" height="2" /><rect y="5" width="14" height="2" /><rect y="10" width="14" height="2" /></svg></button>
<div id="panel" class="aqua-win" role="dialog" aria-label="Settings">
  <div class="titlebar"><span class="tl r" id="pclose" title="Close"></span><span class="tl y"></span><span class="tl g"></span><span class="title">Settings</span></div>
  <div class="ab">
    <label class="chk"><input type="checkbox" id="blue"><span class="box"></span>
      <span class="lbl">Presentation mode<small>Blue theme, hides the mascot.</small></span></label>
    <div class="foot"><span></span><button class="aqua-btn def" id="pdone" type="button">Done</button></div>
  </div>
</div>
<main>
  <header>
  </header>

  <h1>Welcome back</h1>
  <p id="when"></p>

  <form id="f" autocomplete="off">
    <div class="row">
      <div class="logo-box"><img id="logo" src="img/google.png" alt="Google"></div>
      <input type="text" id="q" autofocus spellcheck="false">
      <button type="submit">Search</button>
    </div>
    <div class="pick">
      <label for="engine">Search with:</label>
      <select id="engine">
        <option value="google">Google</option>
        <option value="bing">Live Search</option>
        <option value="ddg">DuckDuckGo</option>
      </select>
    </div>
  </form>
</main>

<div class="peek" id="peek" role="button" tabindex="0" aria-label="Mascot"><img src="img/mascot_full.png" alt=""><div class="pbubble" id="pbubble">i love men!!!</div></div>
<script src="peek.js"></script>
<footer>Best viewed at 1024&times;768<span class="heart"> &middot; made with love ^_^</span></footer>

<script>
  // Add or change providers here. {q} is replaced with the encoded query.
  var ENGINES = {
    google: { name: "Google",     logo: "img/google.png", url: "https://www.google.com/search?q={q}" },
    bing:   { name: "Live Search", logo: "img/bing.png",   url: "https://www.bing.com/search?q={q}" },
    ddg:    { name: "DuckDuckGo", logo: "img/ddg.png",    url: "https://duckduckgo.com/?q={q}" }
  };
  var KEY = "newtab-engine";

  var sel = document.getElementById("engine");
  var logo = document.getElementById("logo");
  var q = document.getElementById("q");

  function apply(id) {
    var e = ENGINES[id] || ENGINES.google;
    var blue = document.documentElement.getAttribute("data-theme") === "blue";
    logo.src = (blue && e.blueLogo) || e.logo;
    logo.alt = e.name;
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (err) {}
  if (!ENGINES[saved]) saved = "google";
  sel.value = saved;
  apply(saved);

  sel.addEventListener("change", function () {
    apply(sel.value);
    try { localStorage.setItem(KEY, sel.value); } catch (err) {}
    q.focus();
  });

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = q.value.trim();
    if (!text) return;
    window.location.href = ENGINES[sel.value].url.replace("{q}", encodeURIComponent(text));
  });


  // ---- settings: presentation mode (blue, no mascot) ----
  var THEME_KEY = "newtab-theme";
  var fav = document.getElementById("fav");
  var blueBox = document.getElementById("blue");
  var panel = document.getElementById("panel");
  var NEUTRAL_FAV = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='#4a8ae0'/><circle cx='16' cy='16' r='14' fill='none' stroke='#fff' stroke-opacity='.6' stroke-width='2'/></svg>");

  function setTheme(blue) {
    if (blue) {
      document.documentElement.setAttribute("data-theme", "blue");
      fav.type = "image/svg+xml"; fav.href = NEUTRAL_FAV;
    } else {
      document.documentElement.removeAttribute("data-theme");
      fav.type = "image/png"; fav.href = "img/mascot_icon.png";
    }
    blueBox.checked = blue;
    if (typeof apply === "function" && sel) apply(sel.value);
    try { localStorage.setItem(THEME_KEY, blue ? "blue" : "pink"); } catch (err) {}
  }

  var startBlue = document.documentElement.getAttribute("data-theme") === "blue";
  setTheme(startBlue);

  blueBox.addEventListener("change", function () { setTheme(blueBox.checked); });
  document.getElementById("gear").addEventListener("click", function (ev) {
    ev.stopPropagation(); panel.classList.toggle("open");
  });
  panel.addEventListener("click", function (ev) { ev.stopPropagation(); });
  document.addEventListener("click", function () { panel.classList.remove("open"); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") panel.classList.remove("open"); });
  document.getElementById("pclose").addEventListener("click", function () { panel.classList.remove("open"); });
  document.getElementById("pdone").addEventListener("click", function () { panel.classList.remove("open"); });


  // date + clock line
  function tick() {
    var d = new Date();
    document.getElementById("when").textContent =
      d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) +
      " \u00b7 " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  tick(); setInterval(tick, 15000);

  // keep focus on the search box (new-tab redirect extensions sometimes steal it)
  window.addEventListener("load", function () { q.focus(); });
</script>
</body>
</html>
